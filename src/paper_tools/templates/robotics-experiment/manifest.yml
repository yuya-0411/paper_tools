id: robotics-experiment
name: ロボティクス実験論文
description: ロボットの設計，制御，実験評価を明確に分離する独自テンプレートです．
languages: [ja, en]
document_types: [robotics-paper, experiment-paper]
sections:
  - {id: abstract, title_ja: 概要, title_en: Abstract, purpose_ja: 研究全体を要約します．, purpose_en: "Summarise the complete study."}
  - {id: introduction, title_ja: はじめに, title_en: Introduction, purpose_ja: 課題と目的を示します．, purpose_en: "Define the problem and objective."}
  - {id: related-work, title_ja: 関連研究, title_en: Related Work, purpose_ja: 関連ロボット研究を位置付けます．, purpose_en: "Position the work against verified robotics research."}
  - {id: system-design, title_ja: ロボット・システム設計, title_en: Robot and System Design, purpose_ja: 機構と構成を説明します．, purpose_en: "Describe mechanics and system architecture."}
  - {id: control-method, title_ja: 制御手法, title_en: Control Method, purpose_ja: 制御則と信号の流れを示します．, purpose_en: "Explain the controller and signal flow."}
  - {id: experimental-setup, title_ja: 実験条件, title_en: Experimental Setup, purpose_ja: 再現可能な実験条件を示します．, purpose_en: "Provide reproducible experimental conditions."}
  - {id: evaluation-metrics, title_ja: 評価指標, title_en: Evaluation Metrics, purpose_ja: 指標と算出方法を定義します．, purpose_en: "Define metrics and calculations."}
  - {id: results, title_ja: 結果, title_en: Results, purpose_ja: 入力済みの測定結果を示します．, purpose_en: "Report user-supplied measurements."}
  - {id: discussion, title_ja: 考察, title_en: Discussion, purpose_ja: 結果を解釈します．, purpose_en: "Interpret the supplied results."}
  - {id: limitations, title_ja: 制約と失敗例, title_en: Limitations, purpose_ja: 限界と失敗条件を示します．, purpose_en: "State limits and failure conditions."}
  - {id: conclusion, title_ja: 結論, title_en: Conclusion, purpose_ja: 結論をまとめます．, purpose_en: "Summarise the findings."}
  - {id: references, title_ja: 参考文献, title_en: References, purpose_ja: 登録文献を示します．, purpose_en: "List registered references."}
required_inputs: [title, objective, system_design, method, experimental_conditions, metrics]
optional_inputs: [novelty, results, discussion, limitations, future_work]
recommended_figures: [ロボット外観図, システム全体図, 制御ブロック図, 実験環境図, 実験結果グラフ]
recommended_tables: [定量比較表, ロボット仕様表]
recommended_data: [自由度, アクチュエータ, センサ, 制御周期, 試行回数, 失敗例]
page: {paper: a4, margin_mm: 19, target_pages: 8}
columns: 1
fonts: {body: platform-default, heading: platform-default}
version: 1.0.0
intended_use: Robotics design and experimental evaluation papers
original: true
