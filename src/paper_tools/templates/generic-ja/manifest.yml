id: generic-ja
name: 日本語標準論文
description: 日本語の研究論文を一から構成するための独自汎用テンプレートです．
languages: [ja]
document_types: [research-paper, journal-paper, thesis-draft]
sections:
  - {id: abstract, title_ja: 概要, title_en: Abstract, purpose_ja: 目的・手法・結果を簡潔に示します．, purpose_en: "Summarise the objective, method, and results."}
  - {id: introduction, title_ja: はじめに, title_en: Introduction, purpose_ja: 背景，課題，目的，新規性を示します．, purpose_en: "Present the background, problem, objective, and novelty."}
  - {id: related-work, title_ja: 関連研究, title_en: Related Work, purpose_ja: 確認済みの文献に基づき位置付けます．, purpose_en: "Position the work using verified references."}
  - {id: method, title_ja: 提案手法, title_en: Method, purpose_ja: 手法とシステム構成を説明します．, purpose_en: "Explain the method and system design."}
  - {id: experiments, title_ja: 実験, title_en: Experiments, purpose_ja: 条件と評価方法を記載します．, purpose_en: "Report conditions and evaluation methods."}
  - {id: results-discussion, title_ja: 結果と考察, title_en: Results and Discussion, purpose_ja: 入力済み結果とその解釈を区別して示します．, purpose_en: "Separate supplied results from interpretation."}
  - {id: conclusion, title_ja: 結論, title_en: Conclusion, purpose_ja: 結論，制約，今後の課題をまとめます．, purpose_en: "Summarise conclusions, limits, and future work."}
  - {id: references, title_ja: 参考文献, title_en: References, purpose_ja: 登録済み文献だけを列挙します．, purpose_en: "List only registered references."}
required_inputs: [title, objective, method]
optional_inputs: [background, novelty, experimental_conditions, metrics, results, discussion, limitations]
recommended_figures: [システム構成図, 実験環境図, 結果グラフ]
recommended_tables: [条件比較表]
recommended_data: [実験条件, 測定結果, 試行回数]
page: {paper: a4, margin_mm: 22, target_pages: 8}
columns: 1
fonts: {body: platform-default, heading: platform-default}
version: 1.0.0
intended_use: 日本語の一般的な研究論文
original: true
