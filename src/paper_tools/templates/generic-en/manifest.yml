id: generic-en
name: English Research Paper
description: An original general-purpose template for a concise academic research paper.
languages: [en]
document_types: [research-paper, journal-paper, thesis-draft]
sections:
  - {id: abstract, title_ja: 概要, title_en: Abstract, purpose_ja: 目的・手法・結果を要約します．, purpose_en: "Summarise the objective, method, and supplied results."}
  - {id: introduction, title_ja: はじめに, title_en: Introduction, purpose_ja: 背景と目的を示します．, purpose_en: "Establish the background, problem, objective, and contribution."}
  - {id: related-work, title_ja: 関連研究, title_en: Related Work, purpose_ja: 文献に基づき位置付けます．, purpose_en: "Position the work using verified sources."}
  - {id: method, title_ja: 手法, title_en: Method, purpose_ja: 手法を説明します．, purpose_en: "Explain the method sufficiently for scrutiny."}
  - {id: experiments, title_ja: 実験, title_en: Experiments, purpose_ja: 実験条件を説明します．, purpose_en: "State the setup, conditions, baselines, and metrics."}
  - {id: results, title_ja: 結果, title_en: Results, purpose_ja: 結果を示します．, purpose_en: "Report only results supplied by the user."}
  - {id: discussion, title_ja: 考察, title_en: Discussion, purpose_ja: 結果を解釈します．, purpose_en: "Interpret results without overstating them."}
  - {id: conclusion, title_ja: 結論, title_en: Conclusion, purpose_ja: 結論をまとめます．, purpose_en: "Summarise the conclusions and future work."}
  - {id: references, title_ja: 参考文献, title_en: References, purpose_ja: 登録文献を示します．, purpose_en: "List only user-registered references."}
required_inputs: [title, objective, method]
optional_inputs: [background, novelty, experimental_conditions, metrics, results, discussion, limitations]
recommended_figures: [system overview, experimental setup, results graph]
recommended_tables: [quantitative comparison]
recommended_data: [experimental conditions, measured results, trial count]
page: {paper: a4, margin_mm: 24, target_pages: 8}
columns: 1
fonts: {body: platform-default, heading: platform-default}
version: 1.0.0
intended_use: General English-language academic papers
original: true
