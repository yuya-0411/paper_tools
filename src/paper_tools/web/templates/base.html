<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ローカルファーストのTypst論文作成支援ツール">
  <title>{% block title %}paper_tools{% endblock %}</title>
  <link rel="stylesheet" href="{{ request.url_for('static', path='app.css') }}">
  <script defer src="{{ request.url_for('static', path='vendor/htmx.min.js') }}"></script>
  <script defer src="{{ request.url_for('static', path='app.js') }}"></script>
  <script defer src="{{ request.url_for('static', path='vendor/alpine.min.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="paper_tools ホーム">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>paper_tools</span>
    </a>
    <nav class="topnav" aria-label="メインナビゲーション">
      <a href="/projects" {% if active_page == 'projects' %}aria-current="page"{% endif %}>プロジェクト</a>
      <a href="/templates" {% if active_page == 'templates' %}aria-current="page"{% endif %}>テンプレート</a>
      <a href="/settings" {% if active_page == 'settings' %}aria-current="page"{% endif %}>設定</a>
    </nav>
  </header>
  <div id="global-message" class="notice notice-error" role="alert" tabindex="-1" hidden></div>
  <main id="main-content" class="page {% block page_class %}{% endblock %}">
    {% if flash %}<div class="notice" role="status">{{ flash }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
