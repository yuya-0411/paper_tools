{% if job %}<div class="notice" {% if job.state in ['planning','generating','rendering','compiling'] %}hx-get="/jobs/{{ job.id }}" hx-trigger="every 1s" hx-swap="outerHTML"{% endif %}><div class="cluster"><span class="badge {% if job.state == 'completed' %}badge-success{% elif job.state == 'failed' %}badge-required{% endif %}">{{ job.state_label }}</span><strong>{{ job.message }}</strong><span class="muted">{{ job.progress }}%</span>{% if job.state in ['planning','generating','rendering','compiling'] %}<form hx-post="/jobs/{{ job.id }}/cancel" hx-target="closest .notice" hx-swap="outerHTML"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="button button-small button-danger" type="submit">取り消す</button></form>{% endif %}</div>{% if job.error %}<p class="notice-error">{{ job.error }}</p>{% endif %}</div>{% endif %}
