<h2>図・表・データ</h2>
<form class="stack" method="post" action="/projects/{{ project.id }}/assets" enctype="multipart/form-data"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="asset-file">ファイルを追加</label><input id="asset-file" name="file" type="file" required accept=".png,.jpg,.jpeg,.svg,.pdf,.csv,.json,.txt,.yml,.yaml"></div><div class="field"><label for="asset-kind">種別</label><select id="asset-kind" name="kind"><option value="">拡張子から判定</option><option value="figure">図</option><option value="photo">写真</option><option value="graph">グラフ</option><option value="table">表</option><option value="data">データ</option><option value="log">実験ログ</option><option value="other">その他</option></select></div><div class="field"><label for="asset-description-edit">説明</label><input id="asset-description-edit" name="description"></div><div class="field"><label for="asset-purpose">論文中での用途</label><input id="asset-purpose" name="purpose"></div><div class="field"><label for="asset-section">使用予定セクション</label><input id="asset-section" name="target_section"></div><div class="field"><label for="asset-source">出典</label><input id="asset-source" name="source"></div><label class="checkbox"><input name="is_original" type="checkbox" value="1" checked>自作資料である</label><button class="button button-small" type="submit">安全にアップロード</button></form>
<div class="stack section-block">
  {% for asset in assets %}<article class="card"><div class="cluster cluster-spread"><h3>{{ asset.display_name }}</h3><a class="button button-small button-quiet" href="/projects/{{ project.id }}/assets/{{ asset.id }}">ダウンロード</a></div><p class="small muted">{{ asset.kind }} · {{ asset.size_display }}{% if asset.target_section %} · {{ asset.target_section }}{% endif %}</p><p>{{ asset.description or '説明なし' }}</p><details><summary>メタデータを編集</summary><form class="stack section-block" method="post" action="/projects/{{ project.id }}/assets/{{ asset.id }}/update"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><div class="field"><label for="asset-name-{{ asset.id }}">表示名</label><input id="asset-name-{{ asset.id }}" name="display_name" value="{{ asset.display_name }}" required></div><div class="field"><label for="asset-kind-{{ asset.id }}">種別</label><select id="asset-kind-{{ asset.id }}" name="kind">{% for value, label in [('figure','図'),('photo','写真'),('graph','グラフ'),('table','表'),('data','データ'),('log','実験ログ'),('other','その他')] %}<option value="{{ value }}" {% if asset.kind == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="field"><label for="asset-description-{{ asset.id }}">説明</label><textarea id="asset-description-{{ asset.id }}" name="description">{{ asset.description }}</textarea></div><div class="field"><label for="asset-purpose-{{ asset.id }}">用途</label><input id="asset-purpose-{{ asset.id }}" name="purpose" value="{{ asset.purpose }}"></div><div class="field"><label for="asset-section-{{ asset.id }}">予定セクション</label><input id="asset-section-{{ asset.id }}" name="target_section" value="{{ asset.target_section or '' }}"></div><div class="field"><label for="asset-source-{{ asset.id }}">出典</label><input id="asset-source-{{ asset.id }}" name="source" value="{{ asset.source }}"></div><label class="checkbox"><input name="is_original" type="checkbox" value="1" {% if asset.is_original %}checked{% endif %}>自作資料である</label><button class="button button-small" type="submit">更新</button></form><form method="post" action="/projects/{{ project.id }}/assets/{{ asset.id }}/delete"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="button button-small button-danger" type="submit">このファイルを削除</button></form></details></article>{% else %}<p class="muted">登録済みの図・データはありません．</p>{% endfor %}
</div>
