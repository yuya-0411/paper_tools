<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="環境構築なしで使える，ローカルファーストの学術論文作成支援Webアプリケーション"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'self'"
    />
    <meta name="color-scheme" content="light" />
    <title>paper_tools — 論文作成ワークスペース</title>
    <link rel="stylesheet" href="./assets/app.css" />
    <link rel="stylesheet" href="./assets/print.css" media="print" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">本文へ移動</a>
    <div class="app-shell" id="app-shell">
      <header class="topbar">
        <div class="topbar__brand-group">
          <button class="icon-button mobile-only" id="sidebar-toggle" type="button" aria-label="メニューを開く">
            <span aria-hidden="true">☰</span>
          </button>
          <a class="brand" href="#home" aria-label="paper_tools ホーム">
            <span class="brand__mark" aria-hidden="true">p</span>
            <span>
              <strong>paper_tools</strong>
              <small>論文作成ワークスペース</small>
            </span>
          </a>
        </div>
        <div class="topbar__status" aria-live="polite">
          <span class="status-dot" id="storage-dot" aria-hidden="true"></span>
          <span id="storage-status">保存領域を確認中</span>
          <span class="save-state" id="save-state"></span>
        </div>
        <div class="topbar__actions" id="context-actions"></div>
      </header>

      <div class="workspace">
        <aside class="sidebar" id="sidebar" aria-label="メインメニュー">
          <nav class="main-nav">
            <a href="#home" data-nav="home"><span aria-hidden="true">⌂</span>ホーム</a>
            <a href="#projects" data-nav="projects"><span aria-hidden="true">□</span>プロジェクト</a>
            <a href="#cloud" data-nav="cloud"><span aria-hidden="true">↻</span>端末間同期</a>
            <a href="#new" data-nav="new"><span aria-hidden="true">＋</span>新規作成</a>
            <a href="#templates" data-nav="templates"><span aria-hidden="true">▤</span>テンプレート</a>
            <a href="#assistant" data-nav="assistant"><span aria-hidden="true">✦</span>AI作業台</a>
          </nav>
          <div class="sidebar__secondary">
            <a href="#settings" data-nav="settings"><span aria-hidden="true">⚙</span>設定</a>
            <button class="sidebar-link" id="open-guide" type="button"><span aria-hidden="true">?</span>使い方</button>
          </div>
          <section class="privacy-note" aria-label="データの取扱い">
            <strong id="privacy-mode-title">端末内モード</strong>
            <p id="privacy-mode-detail">同期を有効にするまで，入力内容を外部へ送信しません．</p>
          </section>
        </aside>

        <main id="main-content" tabindex="-1">
          <div class="loading-panel" id="initial-loading" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <p>ワークスペースを準備しています…</p>
          </div>
        </main>
      </div>
    </div>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

    <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <div class="dialog__heading">
          <h2 id="dialog-title">確認</h2>
          <button class="icon-button" value="cancel" aria-label="閉じる" type="submit">×</button>
        </div>
        <div id="dialog-body"></div>
        <div class="dialog__actions" id="dialog-actions"></div>
      </form>
    </dialog>

    <input
      id="project-import-input"
      type="file"
      accept="application/json,application/zip,.json,.zip"
      hidden
    />
    <input
      id="template-import-input"
      type="file"
      accept="application/json,text/plain,text/markdown,text/html,.json,.md,.markdown,.txt,.typ,.typst,.tex,.latex,.html,.htm"
      hidden
    />

    <noscript>
      <div class="noscript-message">
        <h1>JavaScriptを有効にしてください</h1>
        <p>paper_toolsはブラウザ内だけで保存と生成を行うため，JavaScriptが必要です．</p>
      </div>
    </noscript>

    <script defer src="./scripts/templates.js"></script>
    <script defer src="./scripts/custom-templates.js"></script>
    <script defer src="./scripts/core.js"></script>
    <script defer src="./scripts/references.js"></script>
    <script defer src="./scripts/storage.js"></script>
    <script defer src="./scripts/generator.js"></script>
    <script defer src="./scripts/evidence-audit.js"></script>
    <script defer src="./scripts/zip.js"></script>
    <script defer src="./scripts/export.js"></script>
    <script defer src="./scripts/ai-prompts.js"></script>
    <script defer src="./scripts/cloud-config.js"></script>
    <script defer src="./scripts/vendor/supabase-2.110.8.min.js"></script>
    <script defer src="./scripts/cloud-sync.js"></script>
    <script defer src="./scripts/ui.js"></script>
  </body>
</html>
