research:
  summary: >-
    Evaluate a bounded-gain feedback rule on a simulated thermal actuator and
    demonstrate the paper_tools English generation and Typst export path.
  objective: Describe a reproducible synthetic benchmark and report its explicitly generated data.
  novelty: The example combines a gain bound with a simple saturation-aware update for demonstration.
  proposed_method: A proportional controller clips the command to a fixed safe range.
  experimental_conditions: Ten synthetic runs at a 50 C target, 0.2 s sample interval, and identical initial state.
  evaluation_metrics: Settling time, absolute steady-state error, and peak command.
  results: Synthetic mean settling time was 12.8 s and mean absolute error was 0.42 C.
  limitations: This is a deterministic software demonstration without hardware or uncertainty modeling.
  conclusion: The sample verifies the application workflow, not a physical performance claim.
keywords: [thermal actuator, feedback control, synthetic benchmark, Typst]
