research:
  summary: >-
    床面の反射強度を測る前方センサを持つ小型移動ロボットについて，
    閾値を超えたときに減速して停止する単純な制御則を検討する．
  bullet_notes:
    - 低価格な反射センサを2個使用する
    - 目標線の手前で滑らかに減速する
    - 8回の停止試行を行った
    - 記録値はすべてデモ用の合成データである
  achieved: 合成試験では全8回が許容範囲内で停止した．
  key_message: 単純な二段階減速でも再現可能な評価手順を組み立てられる．
  background: 教育用ロボットでは，複雑な外部計測を使わず停止位置を評価したい場合がある．
  current_problem: 反射強度は床材と照明の影響を受けるため，固定閾値だけでは停止位置が変動する．
  objective: 反射強度に基づく二段階減速則の停止誤差を，合成データを用いて記述する．
  novelty: ""
  proposed_method: 左右センサの平均強度に二つの閾値を設定し，通常走行，減速，停止を切り替える．
  system_configuration: 二輪移動台車，左右の反射センサ，motor controller，local loggerで構成する．
  experimental_conditions: 速度0.25 m/s，平坦な白色床面，停止線幅40 mm，8試行という架空条件である．
  evaluation_metrics: 停止線中心から車体基準点までの符号付き停止誤差mmとする．
  results: 合成データの絶対誤差平均は約6.1 mmであり，全試行が10 mm以内であった．
  discussion: 閾値周辺のsensor noiseと床面状態が誤差要因となり得る．
  limitations: 単一床面の合成データだけであり，実機性能を示さない．
  conclusion: 二段階減速則を記述する最小構成と評価例を示した．
  future_work: 実機，複数床材，照明変化，従来手法との比較が必要である．
keywords:
  - 移動ロボット
