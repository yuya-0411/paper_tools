<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">小型移動ロボットのシステム構成</title>
  <desc id="desc">左右の反射センサ，制御器，モータドライバ，車輪，ロガーの信号経路を示す独自作成図</desc>
  <rect width="900" height="420" fill="#f7f9fb"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#18212b">
    <rect x="70" y="70" width="190" height="105" rx="14" fill="#dceef8" stroke="#24658a" stroke-width="3"/>
    <text x="165" y="112" font-size="24">左右反射センサ</text>
    <text x="165" y="145" font-size="18">反射強度 rL，rR</text>
    <rect x="355" y="70" width="190" height="105" rx="14" fill="#e5e2f7" stroke="#584b9b" stroke-width="3"/>
    <text x="450" y="112" font-size="24">制御器</text>
    <text x="450" y="145" font-size="18">閾値判定・速度指令</text>
    <rect x="640" y="70" width="190" height="105" rx="14" fill="#e1f2e5" stroke="#3b7c4c" stroke-width="3"/>
    <text x="735" y="112" font-size="24">モータドライバ</text>
    <text x="735" y="145" font-size="18">左右車輪</text>
    <rect x="355" y="270" width="190" height="90" rx="14" fill="#fff1d8" stroke="#9a6a16" stroke-width="3"/>
    <text x="450" y="307" font-size="24">ロガー</text>
    <text x="450" y="338" font-size="18">時刻・センサ・指令</text>
  </g>
  <g fill="none" stroke="#394b59" stroke-width="4" marker-end="url(#arrow)">
    <path d="M260 122 H350"/>
    <path d="M545 122 H635"/>
    <path d="M450 180 V265"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#394b59"/>
    </marker>
  </defs>
  <text x="450" y="400" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#536475">paper_tools original synthetic sample</text>
</svg>
