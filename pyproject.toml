[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-tools"
version = "0.2.0"
description = "ローカルファーストのTypst論文作成支援Webアプリケーション"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "paper_tools contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "python-multipart>=0.0.9,<1",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "httpx2>=2,<3",
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.7,<1",
  "types-PyYAML>=6.0,<7",
]
desktop = [
  "pillow>=11,<13",
  "pyinstaller>=6.15,<7",
  "pystray>=0.19.5,<1",
]

[project.scripts]
paper-tools = "paper_tools.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_tools = [
  "templates/**/*.yml",
  "templates/**/*.j2",
  "templates/**/*.png",
  "web/templates/**/*.html",
  "web/static/**/*.css",
  "web/static/**/*.js",
  "web/static/**/*.txt",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["typst: requires the local Typst CLI"]

[tool.coverage.run]
branch = true
source = ["paper_tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
omit = ["src/paper_tools/__main__.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"src/paper_tools/cli.py" = ["B008"]
"src/paper_tools/web/routes/**/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pystray", "pystray.*", "yaml", "yaml.*"]
ignore_missing_imports = true
