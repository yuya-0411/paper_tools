name: Windows desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Self-contained Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
      - name: Install locked build dependencies
        run: uv sync --locked --extra dev --extra desktop
      - name: Download verified Typst binary
        run: uv run --no-sync python scripts/fetch_typst.py
      - name: Build portable application
        run: uv run --no-sync pyinstaller --noconfirm --clean packaging/paper_tools.spec
      - name: Smoke-test frozen application
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "paper-tools-self-test.json"
          $env:PAPER_TOOLS_SELF_TEST_REPORT = $report
          $process = Start-Process -FilePath ".\dist\paper_tools\paper_tools.exe" -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          Get-Content -LiteralPath $report
          if ($process.ExitCode -ne 0) {
            throw "Frozen application self-test failed with exit code $($process.ExitCode)"
          }
      - name: Build installer and portable archive
        shell: pwsh
        run: |
          $version = uv run --no-sync python -c "from paper_tools import __version__; print(__version__)"
          $env:PAPER_TOOLS_VERSION = $version.Trim()
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found on the Windows runner"
          }
          & $iscc ".\packaging\paper_tools.iss"
          Compress-Archive -Path ".\dist\paper_tools" -DestinationPath ".\dist\paper-tools-windows-x64.zip" -CompressionLevel Optimal
          Copy-Item -LiteralPath ".\dist\installer\paper-tools-setup-x64.exe" -Destination ".\dist\paper-tools-setup-x64.exe"
          $assetPaths = @(
            ".\dist\paper-tools-setup-x64.exe",
            ".\dist\paper-tools-windows-x64.zip"
          )
          $checksumLines = foreach ($assetPath in $assetPaths) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $assetPath
            "$($hash.Hash.ToLowerInvariant())  $([System.IO.Path]::GetFileName($assetPath))"
          }
          Set-Content -LiteralPath ".\dist\SHA256SUMS.txt" -Value $checksumLines -Encoding ascii
      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v6
        with:
          name: paper-tools-windows-x64
          path: |
            dist/paper-tools-setup-x64.exe
            dist/paper-tools-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (uv run --no-sync python -c "from paper_tools import __version__; print(__version__)").Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version"
          }
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            ".\dist\paper-tools-setup-x64.exe",
            ".\dist\paper-tools-windows-x64.zip",
            ".\dist\SHA256SUMS.txt"
          )
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME @assets --repo $env:GITHUB_REPOSITORY --title "paper_tools $env:GITHUB_REF_NAME" --generate-notes
          }
        
    permissions:
      contents: write
